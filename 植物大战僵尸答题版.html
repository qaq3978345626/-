<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>植物大战僵尸 · 答题防线</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='14' cy='16' r='11' fill='%234caf50'/%3E%3Crect x='22' y='13' width='9' height='6' rx='3' fill='%232e7d32'/%3E%3Ccircle cx='11' cy='13' r='2.5' fill='%23fff'/%3E%3Ccircle cx='11' cy='13' r='1.2' fill='%23222'/%3E%3C/svg%3E">
<style>
/* ============ 基础与色板 ============ */
:root{
  --grass-a:#7cb342; --grass-b:#689f38; --grass-dark:#33691e;
  --soil:#8d6e63; --panel:#f3efe2; --ink:#2b2b25; --paper:#fffdf6;
  --pea:#66bb6a; --pea-dark:#2e7d32;
  --zombie:#9e9d89; --zombie-dark:#6b6a58; --skin:#b5c49a;
  --cone:#ef8a2c; --bucket:#9aa3ad; --bucket-dark:#626b75;
  --danger:#d8483e; --gold:#f4b733; --accent:#3f7d34;
}

/* 手机 Web 容器触控强化：消除点击延迟，防止回弹/下拉刷新 */
.btn,.board,.opt{touch-action:manipulation;}
body{overscroll-behavior:none;-webkit-overflow-scrolling:touch;}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:linear-gradient(160deg,#e8e2d0 0%,#d8d1bb 100%);
  color:var(--ink);min-height:100%;padding:14px 12px 28px;
}
.wrap{max-width:980px;margin:0 auto;}

/* ============ 顶部 HUD ============ */
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px;}
.title{font-size:22px;font-weight:800;letter-spacing:.5px;}
.title small{display:block;font-size:12px;font-weight:500;color:#6d6a5c;margin-top:2px;}
.hud{display:flex;gap:8px;flex-wrap:wrap;}
.hud .chip{
  background:var(--paper);border:1px solid #d8d2bf;border-radius:10px;
  padding:7px 12px;font-size:13px;font-weight:700;min-width:74px;text-align:center;
  box-shadow:0 2px 0 #d8d2bf;
}
.hud .chip b{display:block;font-size:18px;color:var(--accent);}
.hud .chip.neg b{color:var(--danger);}

/* ============ 游戏板 ============ */
.stage{
  position:relative;background:var(--soil);border-radius:14px;padding:10px;
  border:3px solid #6d5246;box-shadow:0 8px 22px rgba(60,45,30,.25);
}
.board{
  position:relative;width:100%;aspect-ratio:9/5;border-radius:8px;overflow:hidden;
  background-image:
   linear-gradient(rgba(0,0,0,.14),rgba(0,0,0,.14)),
   repeating-linear-gradient(0deg,transparent 0,transparent calc(100%/5 - 1px),rgba(0,0,0,.22) calc(100%/5 - 1px),rgba(0,0,0,.22) calc(100%/5)),
   repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/9 - 1px),rgba(0,0,0,.22) calc(100%/9 - 1px),rgba(0,0,0,.22) calc(100%/9)),
   var(--lawn);
  background-size:cover,100% 100%,100% 100%,cover;
  background-position:center;
  cursor:crosshair;user-select:none;
}
/* 最左侧“家”列标记 */
.home-col{
  position:absolute;left:0;top:0;width:calc(100%/9);height:100%;
  background:rgba(46,125,50,.28);border-right:2px dashed rgba(255,255,255,.55);
}
/* 行定位辅助 */
.entity{position:absolute;transition:left .35s ease,top .35s ease;display:flex;align-items:center;justify-content:center;}
.cell-w{width:calc(100%/9);height:calc(100%/5);}

/* ---- 豌豆射手（纯 CSS 造型） ---- */
.shooter{z-index:6;}
.shooter .plant{position:relative;width:78%;height:78%;animation:idle 1.6s ease-in-out infinite;}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
.shooter .stem{position:absolute;left:46%;bottom:0;width:10%;height:34%;background:var(--pea-dark);border-radius:4px;}
.shooter .leaf{position:absolute;bottom:18%;width:34%;height:16%;background:var(--pea);border-radius:0 100% 0 100%;}
.shooter .leaf.l{left:14%;transform:rotate(-18deg);}
.shooter .leaf.r{right:12%;transform:scaleX(-1) rotate(-18deg);}
.shooter .head{
  position:absolute;top:4%;left:14%;width:72%;height:62%;background:var(--pea);
  border:2px solid var(--pea-dark);border-radius:50%;
}
.shooter .muzzle{
  position:absolute;right:-16%;top:34%;width:34%;height:30%;background:var(--pea-dark);
  border-radius:0 40% 40% 0;
}
.shooter .eye{position:absolute;left:26%;top:30%;width:16%;height:22%;background:#fff;border-radius:50%;}
.shooter .eye::after{content:"";position:absolute;left:28%;top:24%;width:55%;height:55%;background:#1b1b1b;border-radius:50%;}
.shooter .mouth{position:absolute;left:40%;top:62%;width:18%;height:12%;background:var(--pea-dark);border-radius:50%;}
.shooter.fire .plantimg{animation:recoil .25s ease;}
@keyframes recoil{0%{transform:translateX(0)}40%{transform:translateX(-14%)}100%{transform:translateX(0)}}

/* ---- 子弹 ---- */
.bullet{z-index:5;transition:left .32s linear;width:calc(100%/9);height:calc(100%/5);pointer-events:none;}
.bullet .ball{width:34%;height:34%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a5d6a7,var(--pea-dark));box-shadow:0 0 6px rgba(46,125,50,.6);}
.bullet.wrong .ball{background:radial-gradient(circle at 35% 30%,#ef9a9a,#b71c1c);}

/* ---- 僵尸 ---- */
.zombie{z-index:4;}
.zombie .z{position:relative;width:82%;height:88%;}
.zombie .legs{position:absolute;left:20%;bottom:0;width:60%;height:26%;display:flex;justify-content:space-between;}
.zombie .legs span{width:30%;height:100%;background:var(--zombie-dark);border-radius:3px;animation:walk .7s ease-in-out infinite alternate;}
.zombie .legs span:last-child{animation-delay:.35s;}
@keyframes walk{from{transform:translateY(0) rotate(4deg)}to{transform:translateY(-12%) rotate(-4deg)}}
.zombie .body{position:absolute;left:16%;bottom:22%;width:68%;height:38%;background:var(--zombie);border-radius:8px 8px 4px 4px;border:2px solid var(--zombie-dark);}
.zombie .arm{position:absolute;top:26%;width:22%;height:30%;background:var(--skin);border:2px solid var(--zombie-dark);border-radius:6px;}
.zombie .arm.f{left:-6%;transform:rotate(12deg);}
.zombie .head-box{position:absolute;left:20%;top:0;width:60%;height:40%;}
.zombie .face{width:100%;height:100%;background:var(--skin);border:2px solid var(--zombie-dark);border-radius:45% 45% 40% 40%;position:relative;}
.zombie .eye{position:absolute;top:34%;width:14%;height:18%;background:#fff;border-radius:50%;}
.zombie .eye::after{content:"";position:absolute;left:30%;top:25%;width:50%;height:55%;background:#111;border-radius:50%;}
.zombie .eye.l{left:20%;}.zombie .eye.r{right:20%;}
.zombie .jaw{position:absolute;bottom:8%;left:30%;width:40%;height:14%;background:#5d6b4d;border-radius:3px;}
/* 路障帽 */
.zombie .cone-hat{
  position:absolute;left:18%;top:-34%;width:64%;height:52%;background:var(--cone);
  clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:3px;
}
.zombie .cone-hat::after{content:"";position:absolute;left:20%;right:20%;top:52%;height:14%;background:#d97706;}
/* 铁桶帽 */
.zombie .bucket-hat{
  position:absolute;left:8%;top:-30%;width:84%;height:55%;background:var(--bucket);
  border:2px solid var(--bucket-dark);border-radius:10px 10px 4px 4px;
}
.zombie .bucket-hat::before{content:"";position:absolute;left:0;right:0;top:22%;height:10%;background:var(--bucket-dark);}
.zombie .bucket-hat::after{content:"";position:absolute;left:0;right:0;top:52%;height:10%;background:var(--bucket-dark);}
/* 血条 */
.hpbar{position:absolute;left:12%;top:-12%;width:76%;height:8%;background:rgba(0,0,0,.35);border-radius:4px;overflow:hidden;}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#66bb6a,#c0ca33);transition:width .3s;}
.hpbar.boost i{background:linear-gradient(90deg,#ff7043,#d8483e);}
/* 击杀动画 */
.zombie.dying{z-index:8;pointer-events:none;}
.zombie.dying .z{animation:die .65s ease forwards;}
@keyframes die{
  0%{transform:scale(1) rotate(0);opacity:1;}
  40%{transform:scale(1.25) rotate(12deg);opacity:.9;}
  100%{transform:scale(.4) rotate(-40deg) translateY(-40%);opacity:0;}
}
.zombie.hit .z{animation:hitshake .25s ease;}
@keyframes hitshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10%)}75%{transform:translateX(10%)}}
.zombie.boost .z{animation:boostpulse .4s ease;}
@keyframes boostpulse{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ---- 图片素材适配 ---- */
.shooter .plantimg{width:92%;height:92%;object-fit:contain;animation:idle 1.6s ease-in-out infinite;}
.zombie .zimg{width:96%;height:96%;object-fit:contain;}
.zombie.dying .zimg{animation:die .65s ease forwards;}
.zombie.hit .zimg{animation:hitshake .25s ease;}
.zombie.boost .zimg{animation:boostpulse .4s ease;}
.bullet .peaimg{width:46%;height:46%;object-fit:contain;}
.bullet.wrong .peaimg{filter:hue-rotate(-90deg) saturate(2.2) brightness(.9);}
img.trophy{object-fit:contain;}
.hpbar{top:-2%;}

/* 浮动得分提示 */
.float-txt{position:absolute;z-index:9;font-weight:800;font-size:clamp(11px,2.2vw,17px);pointer-events:none;animation:floatup .9s ease forwards;text-shadow:0 1px 2px rgba(0,0,0,.4);}
@keyframes floatup{from{transform:translateY(0);opacity:1}to{transform:translateY(-180%);opacity:0}}

/* ---- 奖杯层 ---- */
.trophy-layer{
  position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  background:rgba(20,30,15,.45);border-radius:8px;flex-direction:column;gap:10px;
}
.trophy-layer.show{display:flex;}
.trophy{
  width:clamp(90px,18vw,140px);height:clamp(90px,18vw,140px);cursor:pointer;
  animation:trophyBob 1.4s ease-in-out infinite, trophyGlow 1.6s ease-in-out infinite;
}
@keyframes trophyBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes trophyGlow{0%,100%{filter:drop-shadow(0 0 8px rgba(244,183,51,.7))}50%{filter:drop-shadow(0 0 22px rgba(244,183,51,1))}}
.trophy-tip{color:#fff;font-weight:800;font-size:clamp(14px,2.6vw,20px);text-shadow:0 2px 4px rgba(0,0,0,.5);}

/* ============ 控制区 ============ */
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center;}
.btn{
  border:none;border-radius:12px;font-family:inherit;font-weight:800;cursor:pointer;
  padding:13px 18px;font-size:15px;min-height:48px;box-shadow:0 3px 0 rgba(0,0,0,.22);
  transition:transform .08s;display:inline-flex;align-items:center;gap:7px;
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22);}
.btn-move{background:#eef0e6;color:var(--accent);min-width:64px;justify-content:center;font-size:20px;}
.btn-fire{background:var(--accent);color:#fff;flex:1;min-width:150px;justify-content:center;}
.btn-fire:disabled{opacity:.55;cursor:not-allowed;}
.btn-restart{background:#e8b84b;color:#4a3500;}
.move-group{display:flex;gap:8px;}
.hint{font-size:12px;color:#5d5a4e;margin-top:8px;line-height:1.7;}
.hint b{color:var(--accent);}

/* ============ 答题模态（暂停） ============ */
.modal-mask{
  position:fixed;inset:0;background:rgba(20,22,16,.62);z-index:50;
  display:none;align-items:center;justify-content:center;padding:16px;
}
.modal-mask.show{display:flex;}
.modal{
  background:var(--paper);border-radius:16px;max-width:460px;width:100%;padding:22px 20px;
  box-shadow:0 16px 40px rgba(0,0,0,.35);border:3px solid var(--accent);
}
.modal .pause-tag{font-size:12px;font-weight:800;color:#fff;background:var(--danger);border-radius:20px;padding:3px 12px;display:inline-block;margin-bottom:12px;}
.modal h3{font-size:19px;line-height:1.5;margin-bottom:16px;}
.options{display:grid;gap:10px;}
.opt{
  text-align:left;border:2px solid #cfc9b6;background:#f6f3e8;border-radius:11px;
  padding:13px 14px;font-size:15px;font-family:inherit;cursor:pointer;min-height:48px;font-weight:600;
  transition:background .15s,border-color .15s;
}
.opt:hover{border-color:var(--accent);background:#eef5e6;}
.opt.correct{background:#c8e6c9;border-color:#2e7d32;}
.opt.wrong{background:#ffcdd2;border-color:#c62828;}
.opt:disabled{cursor:default;}
.feedback{margin-top:14px;font-weight:800;font-size:14px;min-height:20px;}
.feedback.ok{color:#2e7d32;}.feedback.no{color:#c62828;}

/* ============ 结算 / 历史 ============ */
.result-banner{
  display:none;margin-top:12px;padding:16px;border-radius:14px;text-align:center;font-weight:800;
  font-size:18px;color:#fff;
}
.result-banner.win{background:linear-gradient(135deg,#43a047,#2e7d32);display:block;}
.result-banner.lose{background:linear-gradient(135deg,#e53935,#b71c1c);display:block;}
.result-banner small{display:block;font-weight:500;margin-top:6px;font-size:13px;opacity:.9;}

.history{margin-top:16px;background:var(--paper);border-radius:14px;padding:14px 16px;border:1px solid #d8d2bf;}
.history h4{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.history h4 button{border:none;background:none;color:var(--danger);font-size:12px;cursor:pointer;font-weight:700;min-height:36px;}
.history ul{list-style:none;display:grid;gap:7px;max-height:200px;overflow:auto;}
.history li{display:flex;justify-content:space-between;font-size:13px;padding:8px 10px;border-radius:8px;background:#f4f1e6;}
.history li .tag{font-weight:800;}
.history li .tag.win{color:#2e7d32;}.history li .tag.lose{color:#c62828;}
.history .empty{font-size:13px;color:#8a8778;text-align:center;padding:8px;}

.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:#524f42;}
.legend span{background:var(--paper);padding:5px 10px;border-radius:20px;border:1px solid #d8d2bf;font-weight:700;}

@media (max-width:560px){
  body{padding:10px 8px 24px;}
  .title{font-size:18px;}
  .hud .chip{min-width:62px;padding:6px 8px;font-size:11px;}
  .hud .chip b{font-size:16px;}
  .stage{padding:7px;}
  .btn{padding:12px 14px;font-size:14px;}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">植物大战僵尸 · 答题防线
      <small>答对才是真子弹，答错只会给僵尸“回血”</small>
    </div>
    <div class="hud">
      <div class="chip" id="scoreChip">分数<b id="score">0</b></div>
      <div class="chip">剩余僵尸<b id="remain">15</b></div>
      <div class="chip">已答题<b id="answered">0</b></div>
    </div>
  </header>

  <div class="stage">
    <div class="board" id="board">
      <div class="home-col"></div>
      <!-- 实体由 JS 渲染 -->
    </div>
    <div class="trophy-layer" id="trophyLayer">
      <img class="trophy" id="trophy" src="" alt="奖杯">
      <div class="trophy-tip">全部僵尸已消灭！点击奖杯通关 +100 分</div>
    </div>
  </div>

  <div class="controls">
    <div class="move-group">
      <button class="btn btn-move" id="upBtn" aria-label="向上移动">▲</button>
      <button class="btn btn-move" id="downBtn" aria-label="向下移动">▼</button>
    </div>
    <button class="btn btn-fire" id="fireBtn">射击（答题后发射）</button>
    <button class="btn btn-restart" id="restartBtn">重新开始</button>
  </div>
  <p class="hint">
    玩法：用 <b>▲▼</b>（或键盘上下键）让豌豆射手在最左列五行间移动；点击 <b>射击</b> 或游戏板，先回答一道题——答题期间游戏暂停。
    答对：子弹命中，僵尸 <b>-1 血</b>；答错：僵尸 <b>+1 血</b> 且扣 <b>5 分</b>。每次答题后所有僵尸前进一格，走到最左列即防线失败。
  </p>

  <div class="result-banner" id="resultBanner"></div>

  <div class="legend">
    <span>普通僵尸 1 血 · 击杀 +10</span>
    <span>路障僵尸 2 血 · 击杀 +25</span>
    <span>铁桶僵尸 3 血 · 击杀 +45</span>
  </div>

  <div class="history">
    <h4>战绩记录（本机保存）<button id="clearHistory">清空记录</button></h4>
    <ul id="historyList"></ul>
  </div>
</div>

<!-- 答题模态 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <span class="pause-tag">时间已暂停</span>
    <h3 id="questionText"></h3>
    <div class="options" id="optionsBox"></div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>

function buildQueue(){
  var q = [];
  for(var i=0;i<10;i++) q.push('normal');
  for(var j=0;j<3;j++) q.push('cone');
  for(var k=0;k<2;k++) q.push('bucket');
  // 洗牌
  for(var x=q.length-1;x>0;x--){
    var y = Math.floor(Math.random()*(x+1));
    var t=q[x];q[x]=q[y];q[y]=t;
  }
  return q;
}

  {q:'发展社会主义民主政治，最根本的是要（ ）', o:['坚持中国特色社会主义政治发展道路','照搬西方政治模式','实行多党轮流执政','推行三权分立'], a:0}

/* ================= 状态 ================= */
var state, uid = 1;
function initState(){
  state = {
    score:0,
    shooterRow:2,
    zombies:[],
    queue:buildQueue(),
    answered:0,
    status:'playing',          // playing | won | lost
    busy:false,                // 射击/答题动画期间锁定
    recentQ:[]
  };
  uid = 1;
}

/* ================= DOM 引用 ================= */
var board = document.getElementById('board');
var scoreEl = document.getElementById('score');
var scoreChip = document.getElementById('scoreChip');
var remainEl = document.getElementById('remain');
var answeredEl = document.getElementById('answered');
var modalMask = document.getElementById('modalMask');
var questionText = document.getElementById('questionText');
var optionsBox = document.getElementById('optionsBox');
var feedback = document.getElementById('feedback');
var fireBtn = document.getElementById('fireBtn');
var trophyLayer = document.getElementById('trophyLayer');
var resultBanner = document.getElementById('resultBanner');

/* ================= 渲染 ================= */
function pct(v){ return (v*100)+'%'; }

function render(){
  // 清掉动态实体（保留 home-col）
  var olds = board.querySelectorAll('.entity,.float-txt');
  for(var i=0;i<olds.length;i++) olds[i].remove();

  // 豌豆射手
  var s = document.createElement('div');
  s.className = 'entity cell-w shooter';
  s.id = 'shooter';
  s.style.left = '0%';
  s.style.top = pct(state.shooterRow/ROWS);
  s.innerHTML = '<img class="plantimg" src="'+ASSETS.shooter+'" alt="豌豆射手">';
  board.appendChild(s);

  // 僵尸
  state.zombies.forEach(function(z){
    var el = document.createElement('div');
    el.className = 'entity cell-w zombie' + (z.dying?' dying':'') + (z.hitCls?' '+z.hitCls:'');
    el.dataset.id = z.id;
    el.style.left = pct(z.col/COLS);
    el.style.top = pct(z.row/ROWS);
    var hpPct = Math.min(100, Math.max(0, Math.round(z.hp/z.maxHp*100)));
    el.innerHTML =
      '<img class="zimg" src="'+ASSETS[z.type]+'" alt="'+ZOMBIE_TYPES[z.type].name+'">'+
      '<div class="hpbar'+(z.boostCls?' boost':'')+'"><i style="width:'+hpPct+'%"></i></div>';
    board.appendChild(el);
  });

  // 子弹
  state.bullets.forEach(function(b){
    var be = document.createElement('div');
    be.className = 'entity cell-w bullet' + (b.wrong?' wrong':'');
    be.style.left = pct(b.col/COLS);
    be.style.top = pct(b.row/ROWS);
    be.innerHTML = '<img class="peaimg" src="'+ASSETS.pea+'" alt="豌豆子弹">';
    board.appendChild(be);
  });

  // 浮动文字
  state.floats.forEach(function(f){
    var fe = document.createElement('div');
    fe.className = 'float-txt';
    fe.style.left = pct(f.col/COLS);
    fe.style.top = pct(f.row/ROWS);
    fe.style.color = f.color;
    fe.textContent = f.text;
    board.appendChild(fe);
  });

  scoreEl.textContent = state.score;
  scoreChip.classList.toggle('neg', state.score < 0);
  remainEl.textContent = state.queue.length + state.zombies.filter(function(z){return !z.dying;}).length;
  answeredEl.textContent = state.answered;
  fireBtn.disabled = state.busy || state.status !== 'playing';
}

/* 浮动提示 */
function addFloat(row,col,text,color){
  state.floats = state.floats || [];
  var f = {row:row,col:col,text:text,color:color};
  state.floats.push(f);
  setTimeout(function(){
    state.floats = state.floats.filter(function(x){return x!==f;});
    render();
  },900);
}

/* ================= 移动射手 ================= */
function moveShooter(delta){
  if(state.status!=='playing' || state.busy) return;
  var r = state.shooterRow + delta;
  if(r>=0 && r<ROWS){ state.shooterRow = r; render(); }
}
document.getElementById('upBtn').onclick = function(){moveShooter(-1);};
document.getElementById('downBtn').onclick = function(){moveShooter(1);};
document.addEventListener('keydown', function(e){
  if(modalMask.classList.contains('show')) return;
  if(e.key==='ArrowUp'){e.preventDefault();moveShooter(-1);}
  if(e.key==='ArrowDown'){e.preventDefault();moveShooter(1);}
  if(e.key===' '){e.preventDefault();startShoot();}
});

/* ================= 答题 ================= */
function pickQuestion(){
  var pool = QUESTIONS.filter(function(q){
    return state.recentQ.indexOf(q) === -1;
  });
  if(pool.length===0){ state.recentQ = []; pool = QUESTIONS.slice(); }
  var q = pool[Math.floor(Math.random()*pool.length)];
  state.recentQ.push(q);
  if(state.recentQ.length>8) state.recentQ.shift();
  return q;
}

function askQuestion(){
  return new Promise(function(resolve){
    var q = pickQuestion();
    questionText.textContent = q.q;
    optionsBox.innerHTML = '';
    feedback.textContent = '';
    feedback.className = 'feedback';
    q.o.forEach(function(text, idx){
      var b = document.createElement('button');
      b.className = 'opt';
      b.textContent = text;
      b.onclick = function(){
        var correct = (idx === q.a);
        var all = optionsBox.querySelectorAll('.opt');
        for(var i=0;i<all.length;i++){
          all[i].disabled = true;
          if(i===q.a) all[i].classList.add('correct');
        }
        if(!correct) b.classList.add('wrong');
        feedback.className = 'feedback ' + (correct?'ok':'no');
        feedback.textContent = correct ? '回答正确！子弹造成 1 点伤害' : '回答错误！僵尸 +1 血，扣除 5 分';
        setTimeout(function(){
          modalMask.classList.remove('show');
          resolve(correct);
        }, 850);
      };
      optionsBox.appendChild(b);
    });
    modalMask.classList.add('show');
  });
}

/* ================= 射击主流程 ================= */
function startShoot(){
  if(state.status!=='playing' || state.busy) return;
  state.busy = true;
  render();

  // 1. 答题（暂停）
  askQuestion().then(function(correct){
    // 2. 找同行最靠前的存活僵尸
    var target = null;
    state.zombies.forEach(function(z){
      if(z.dying || z.row!==state.shooterRow) return;
      if(!target || z.col < target.col) target = z;
    });

    // 射手后坐动画
    var sh = document.getElementById('shooter');
    if(sh){ sh.classList.add('fire'); setTimeout(function(){sh.classList.remove('fire');},260); }

    if(!target){
      // 该行没有僵尸：子弹打空，仍算答完一题
      addFloat(state.shooterRow, COLS-1, '该行无僵尸', '#cfd8dc');
      return finishShot(null, correct);
    }
    fireBullet(target, correct).then(function(){
      return finishShot(target, correct);
    });
  });
}

function fireBullet(target, correct){
  return new Promise(function(resolve){
    var b = {row:state.shooterRow, col:0, wrong:!correct};
    state.bullets.push(b);
    render();
    // 分两段飞到目标，制造速度感
    requestAnimationFrame(function(){
      b.col = Math.max(0, target.col - 0.2);
      render();
    });
    setTimeout(function(){
      state.bullets = state.bullets.filter(function(x){return x!==b;});
      resolve();
    }, 340);
  });
}

function finishShot(target, correct){
  if(target){
    if(correct){
      target.hp -= 1;
      target.hitCls = 'hit';
      if(target.hp <= 0){
        killZombie(target);
      }else{
        addFloat(target.row, target.col, '-1 血', '#fff59d');
      }
    }else{
      // 答错：僵尸 +1 血，扣 5 分
      target.hp += 1;
      target.maxShown = true;
      target.hitCls = 'boost';
      target.boostCls = true;
      state.score -= 5;
      addFloat(target.row, target.col, '+1 血', '#ff8a65');
    }
  }
  state.answered += 1;
  render();

  // 清除命中样式
  setTimeout(function(){
    state.zombies.forEach(function(z){ z.hitCls=''; z.boostCls=false; });
  }, 400);

  // 3. 答题结束：僵尸前进一格 + 新僵尸入场
  setTimeout(function(){
    advanceZombies();
    state.busy = false;
    checkEnd();
    render();
  }, correct ? 420 : 420);
}

/* 击杀 */
function killZombie(z){
  z.dying = true;
  var typeCfg = ZOMBIE_TYPES[z.type];
  state.score += typeCfg.score;
  addFloat(z.row, z.col, '+'+typeCfg.score+' 击杀', '#ffd54f');
  setTimeout(function(){
    state.zombies = state.zombies.filter(function(x){return x!==z;});
    render();
  }, 660);
}

/* 前进一步，并按节奏放入新僵尸 */
function advanceZombies(){
  // 存活僵尸全部前进一格
  state.zombies.forEach(function(z){
    if(!z.dying) z.col -= 1;
  });
  // 每次答题后从队列放出一个新僵尸，从最右列进入，随机行
  if(state.queue.length){
    var type = state.queue.shift();
    var cfg = ZOMBIE_TYPES[type];
    state.zombies.push({
      id:uid++, type:type, row:Math.floor(Math.random()*ROWS),
      col:COLS-1, hp:cfg.hp, maxHp:cfg.hp, dying:false
    });
  }
}

/* ================= 胜负判定 ================= */
function checkEnd(){
  // 僵尸走到第 0 列（家）→ 失败
  var invaded = state.zombies.some(function(z){return !z.dying && z.col <= 0;});
  if(invaded){
    state.status = 'lost';
    showResult(false);
    return;
  }
  // 队列清空且场上无存活僵尸 → 出奖杯
  if(state.queue.length===0 && state.zombies.filter(function(z){return !z.dying;}).length===0){
    state.status = 'won-pending';
    trophyLayer.classList.add('show');
  }
}

/* 点击奖杯：+100 通关 */
document.getElementById('trophy').onclick = function(){
  if(state.status !== 'won-pending') return;
  state.score += 100;
  trophyLayer.classList.remove('show');
  state.status = 'won';
  showResult(true);
  render();
};

function showResult(win){
  resultBanner.className = 'result-banner ' + (win?'win':'lose');
  resultBanner.innerHTML = (win?'通关成功！':'防线失败！') +
    '<small>最终分数 '+state.score+' 分 · 共答题 '+state.answered+' 次</small>';
  saveHistory(win);
}

/* ================= 历史记录 ================= */
var STORE_KEY = 'pvzQuizHistory_v1';
function loadHistory(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch(e){ return []; }
}
function saveHistory(win){
  var list = loadHistory();
  var now = new Date();
  var pad = function(n){return n<10?'0'+n:''+n;};
  var time = now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+' '+
             pad(now.getHours())+':'+pad(now.getMinutes());
  list.unshift({win:win, score:state.score, time:time});
  localStorage.setItem(STORE_KEY, JSON.stringify(list.slice(0,50)));
  renderHistory();
}
function renderHistory(){
  var ul = document.getElementById('historyList');
  var list = loadHistory();
  ul.innerHTML = '';
  if(!list.length){
    ul.innerHTML = '<div class="empty">还没有战绩，开始第一局吧</div>';
    return;
  }
  list.forEach(function(r){
    var li = document.createElement('li');
    li.innerHTML = '<span class="tag '+(r.win?'win':'lose')+'">'+(r.win?'通关':'失败')+'</span>'+
                   '<span>'+r.score+' 分</span><span>'+r.time+'</span>';
    ul.appendChild(li);
  });
}
document.getElementById('clearHistory').onclick = function(){
  localStorage.removeItem(STORE_KEY);
  renderHistory();
};

/* ================= 重新开始 ================= */
function restart(){
  modalMask.classList.remove('show');
  trophyLayer.classList.remove('show');
  resultBanner.className = 'result-banner';
  resultBanner.innerHTML = '';
  initState();
  state.floats = [];
  state.bullets = [];
  render();
}
document.getElementById('restartBtn').onclick = restart;

/* 点击游戏板或射击按钮触发射击 */
fireBtn.onclick = startShoot;
board.addEventListener('click', function(e){
  if(state.status!=='playing' || state.busy) return;
  startShoot();
});

/* ================= 启动 ================= */
initState();
state.floats = [];
state.bullets = [];
document.documentElement.style.setProperty("--lawn",'url("'+IMG_LAWN+'")');
document.getElementById("trophy").src = ASSETS.trophy;
renderHistory();
render();
</script>
